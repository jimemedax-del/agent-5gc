apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cnf-a-envoy
  namespace: cnf-multi-ue
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
spec:
  podSelector:
    matchLabels:
      app: cnf-a-envoy
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 15301
    - protocol: TCP
      port: 15302
    - protocol: TCP
      port: 15303
    - protocol: TCP
      port: 15304
  egress:
  - to:
    - podSelector:
        matchLabels:
          role: backend
    ports:
    - protocol: TCP
      port: 5201
  - to:
    - namespaceSelector:
