metadata:
  name: cnf-a-backends
  namespace: cnf-multi-ue
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
spec:
  podSelector:
    matchLabels:
      role: backend
  policyTypes:
  - Ingress
