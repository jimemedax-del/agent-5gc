# R2.S2/M1: one listener and one backend, no tc shaping or placement comparison.
apiVersion: v1
kind: Namespace
metadata:
  name: cnf-lab
  labels: {app.kubernetes.io/part-of: cnf-m1}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cnf-m1-envoy
  namespace: cnf-lab
  labels: {app.kubernetes.io/part-of: cnf-m1}
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: m1_iperf
        address:
          socket_address: {address: 0.0.0.0, port_value: 15201}
        filter_chains:
        - filters:
          - name: envoy.filters.network.tcp_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
              stat_prefix: m1_iperf
              cluster: m1_backend
              idle_timeout: 60s
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                  log_format:
                    json_format:
                      experiment: cnf-m1-v2
                      listener: m1_iperf
                      start: "%START_TIME%"
                      downstream: "%DOWNSTREAM_REMOTE_ADDRESS%"
                      local: "%DOWNSTREAM_LOCAL_ADDRESS%"
                      upstream: "%UPSTREAM_HOST%"
                      cluster: "%UPSTREAM_CLUSTER%"
                      bytes_received: "%BYTES_RECEIVED%"
                      bytes_sent: "%BYTES_SENT%"
                      duration_ms: "%DURATION%"
                      flags: "%RESPONSE_FLAGS%"
      clusters:
      - name: m1_backend
        type: STRICT_DNS
        connect_timeout: 5s
        load_assignment:
          cluster_name: m1_backend
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    # Absolute DNS name avoids inherited host search domains.
                    address: cnf-m1-backend.cnf-lab.svc.cluster.local.
                    port_value: 5201
    admin:
      address:
        socket_address: {address: 127.0.0.1, port_value: 9901}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-m1-backend
  namespace: cnf-lab
  labels: {app.kubernetes.io/part-of: cnf-m1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cnf-m1-backend}
  template:
    metadata:
      labels: {app: cnf-m1-backend, app.kubernetes.io/part-of: cnf-m1}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {5gc.free5gc.org/plane: control}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: iperf3
        # Reuse verified iperf3 3.9, overriding the UERANSIM entrypoint.
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command: [iperf3]
        args: [-s, -p, "5201", --forceflush, -V]
        ports:
        - {name: iperf, containerPort: 5201, protocol: TCP}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        # Avoid unsolicited connections to iperf's protocol port.
        readinessProbe:
          exec:
            command: [sh, -ec, "kill -0 1"]
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cnf-m1-backend
  namespace: cnf-lab
  labels: {app.kubernetes.io/part-of: cnf-m1}
spec:
  type: ClusterIP
  selector: {app: cnf-m1-backend}
  ports:
  - {name: iperf, port: 5201, targetPort: iperf, protocol: TCP}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-m1-envoy
  namespace: cnf-lab
  labels: {app.kubernetes.io/part-of: cnf-m1}
spec:
  replicas: 1
  selector:
    matchLabels: {app: cnf-m1-envoy}
  template:
    metadata:
      labels: {app: cnf-m1-envoy, app.kubernetes.io/part-of: cnf-m1}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {5gc.free5gc.org/plane: control}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
      - name: envoy
        image: docker.io/envoyproxy/envoy@sha256:63dd445d23d7d419d1bba8b2b9b1b8fdb80f38ae1516fb5d2dcd8856713b7eac
        imagePullPolicy: IfNotPresent
        command: [envoy]
        args: [-c, /etc/envoy/envoy.yaml, --concurrency, "1", --log-level, info, --disable-hot-restart]
        ports:
        - {name: iperf, containerPort: 15201, protocol: TCP}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
        volumeMounts:
        - {name: config, mountPath: /etc/envoy, readOnly: true}
        readinessProbe:
          exec:
            command: [sh, -ec, "kill -0 1"]
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: config
        configMap: {name: cnf-m1-envoy}
---
apiVersion: v1
kind: Service
metadata:
  name: cnf-m1-envoy
  namespace: cnf-lab
  labels: {app.kubernetes.io/part-of: cnf-m1}
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector: {app: cnf-m1-envoy}
  ports:
  - {name: iperf, port: 15201, targetPort: iperf, nodePort: 31201, protocol: TCP}
