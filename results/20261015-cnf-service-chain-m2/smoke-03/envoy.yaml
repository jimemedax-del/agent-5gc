static_resources:
  listeners:
  - name: m2_core
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 15201
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: m2_core
          cluster: m2_core
          idle_timeout: 60s
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  experiment: cnf-m2-v4
                  listener: m2_core
                  start: '%START_TIME%'
                  downstream: '%DOWNSTREAM_REMOTE_ADDRESS%'
                  local: '%DOWNSTREAM_LOCAL_ADDRESS%'
                  upstream: '%UPSTREAM_HOST%'
                  cluster: '%UPSTREAM_CLUSTER%'
                  bytes_received: '%BYTES_RECEIVED%'
                  bytes_sent: '%BYTES_SENT%'
                  duration_ms: '%DURATION%'
                  flags: '%RESPONSE_FLAGS%'
                  business_class: core
  - name: m2_edge
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 15202
    filter_chains:
    - filters:
      - name: envoy.filters.network.tcp_proxy
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
          stat_prefix: m2_edge
          cluster: m2_edge
          idle_timeout: 60s
          access_log:
          - name: envoy.access_loggers.stdout
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              log_format:
                json_format:
                  experiment: cnf-m2-v4
                  listener: m2_edge
                  start: '%START_TIME%'
                  downstream: '%DOWNSTREAM_REMOTE_ADDRESS%'
                  local: '%DOWNSTREAM_LOCAL_ADDRESS%'
                  upstream: '%UPSTREAM_HOST%'
                  cluster: '%UPSTREAM_CLUSTER%'
                  bytes_received: '%BYTES_RECEIVED%'
                  bytes_sent: '%BYTES_SENT%'
                  duration_ms: '%DURATION%'
                  flags: '%RESPONSE_FLAGS%'
                  business_class: edge
  clusters:
  - name: m2_core
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: m2_core
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: cnf-m1-backend.cnf-lab.svc.cluster.local.
                port_value: 5201
  - name: m2_edge
    type: STRICT_DNS
    connect_timeout: 5s
    load_assignment:
      cluster_name: m2_edge
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: cnf-m2-edge.cnf-lab.svc.cluster.local.
                port_value: 5201
admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901
