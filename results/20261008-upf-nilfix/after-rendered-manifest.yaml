# Source: free5gc/charts/free5gc-chf/templates/chf-configmap.yaml
#
# Software Name : free5gc-helm
#
apiVersion: v1
kind: ConfigMap
metadata:
  name:  free5gc-helm-free5gc-chf-configmap
  labels:
    app: free5gc
data:
  chfcfg.yaml: |
    info:
      version: 1.0.3
      description: CHF initial local configuration

    configuration:
      chfName: CHF # the name of this CHF
      sbi: # Service-based interface information
        scheme: http # the protocol for sbi (http or https)
        registerIPv4: free5gc-helm-free5gc-chf-service # IP used to register to NRF
        bindingIPv4: 0.0.0.0 # IP used to bind the service
        port: 8080 # port used to bind the service
        tls: # the local path of TLS key
          pem: ./cert/chf.pem # CHF TLS Certificate
          key: ./cert/chf.key # CHF TLS Private key

      nrfUri: http://nrf-nnrf:8000 # a valid URI of NRF
      nrfCertPem: ./nrf-cert/nrf.pem # NRF Certificate
      serviceNameList: # the SBI services provided by this CHF, refer to TS 32.291
        - nchf-convergedcharging # Nchf_AMPolicyControl service
      mongodb: # the mongodb connected by this CHF
        name: free5gc # name of the mongodb
        url: mongodb://mongodb:27017 # a valid URL of the mongodb
      
      quotaValidityTime: 10000
      volumeLimit: 50000
      volumeLimitPDU: 10000
      volumeThresholdRate: 0.8

      cgf:
        enable: false
        hostIPv4: webui-nbiling
        port: 2122
        listenPort: 2121
        passiveTransferPortRange:
          start: 2123
          end: 2130
        tls:
          pem: ./cert/chf.pem
          key: ./cert/chf.key
        cdrFilePath: /tmp
      abmfDiameter:
        protocol: tcp
        hostIPv4: 0.0.0.0
        port: 3868
        tls:
          pem: ./cert/chf.pem
          key: ./cert/chf.key
      rfDiameter:
        protocol: tcp
        hostIPv4: 0.0.0.0
        port: 3869
        tls:
          pem: ./cert/chf.pem # CHF TLS Certificate
          key: ./cert/chf.key # CHF TLS Private key

    logger: # log output setting
      enable: true
      level: info
      reportCaller: false
