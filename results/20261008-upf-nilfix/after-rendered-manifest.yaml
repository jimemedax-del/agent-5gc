# Source: free5gc/charts/mongodb/templates/extra-list.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  labels:
    project: free5gc
  name: free5gc-pv-mongo
spec:
  accessModes:
  - ReadWriteOnce
  capacity:
    storage: 8Gi
  local:
    path: /home/free5gc/mongo
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - free5gc
  persistentVolumeReclaimPolicy: Retain
  storageClassName: microk8s-hostpath
---
