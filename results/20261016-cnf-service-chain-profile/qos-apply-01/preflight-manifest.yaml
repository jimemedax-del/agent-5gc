apiVersion: v1
kind: ConfigMap
metadata:
  name: cnf-m1-envoy
  namespace: cnf-lab
  labels:
    app.kubernetes.io/part-of: cnf-m1
data:
  envoy.yaml: "static_resources:\n  listeners:\n  - name: m1_iperf\n    address:\n\
    \      socket_address: {address: 0.0.0.0, port_value: 15201}\n    filter_chains:\n\
    \    - filters:\n      - name: envoy.filters.network.tcp_proxy\n        typed_config:\n\
    \          \"@type\": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy\n\
    \          stat_prefix: m1_iperf\n          cluster: m1_backend\n          idle_timeout:\
    \ 60s\n          access_log:\n          - name: envoy.access_loggers.stdout\n\
    \            typed_config:\n              \"@type\": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog\n\
    \              log_format:\n                json_format:\n                  experiment:\
    \ cnf-m1-v3\n                  listener: m1_iperf\n                  start: \"\
    %START_TIME%\"\n                  downstream: \"%DOWNSTREAM_REMOTE_ADDRESS%\"\n\
    \                  local: \"%DOWNSTREAM_LOCAL_ADDRESS%\"\n                  upstream:\
    \ \"%UPSTREAM_HOST%\"\n                  cluster: \"%UPSTREAM_CLUSTER%\"\n   \
    \               bytes_received: \"%BYTES_RECEIVED%\"\n                  bytes_sent:\
    \ \"%BYTES_SENT%\"\n                  duration_ms: \"%DURATION%\"\n          \
    \        flags: \"%RESPONSE_FLAGS%\"\n  clusters:\n  - name: m1_backend\n    type:\
    \ STRICT_DNS\n    connect_timeout: 5s\n    load_assignment:\n      cluster_name:\
    \ m1_backend\n      endpoints:\n      - lb_endpoints:\n        - endpoint:\n \
    \           address:\n              socket_address:\n                # Absolute\
    \ DNS name avoids inherited host search domains.\n                address: cnf-m1-backend.cnf-lab.svc.cluster.local.\n\
    \                port_value: 5201\nadmin:\n  address:\n    socket_address: {address:\
    \ 127.0.0.1, port_value: 9901}\n"
---
apiVersion: v1
kind: Service
metadata:
  name: cnf-m1-backend
  namespace: cnf-lab
  labels:
    app.kubernetes.io/part-of: cnf-m1
spec:
  type: ClusterIP
  selector:
    app: cnf-m1-backend
  ports:
  - name: iperf
    port: 5201
    targetPort: iperf
    protocol: TCP
