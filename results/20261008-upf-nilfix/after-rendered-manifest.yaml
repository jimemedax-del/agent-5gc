#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-helm-free5gc-nrf-nrf
  labels:
    helm.sh/chart: free5gc-nrf-0.2.7
    app.kubernetes.io/name: free5gc-nrf
    app.kubernetes.io/instance: free5gc-helm
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    project: free5gc
    nf: nrf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: free5gc-nrf
      app.kubernetes.io/instance: free5gc-helm
      project: free5gc
      nf: nrf
  template:
    metadata:
      annotations:
        
        checksum/config: 1cb17f1c155f8795e3fd329d1012a5b2bda1334d06c8a4eb560d5334f0769282
      labels:
        app.kubernetes.io/name: free5gc-nrf
        app.kubernetes.io/instance: free5gc-helm
        project: free5gc
        nf: nrf
    spec:
      imagePullSecrets:
        []
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - name: wait-mongo
        image: busybox:1.32.0
        env:
        - name: DEPENDENCIES
          value: mongodb:27017
        command: ["sh", "-c", "until nc -z $DEPENDENCIES; do echo waiting for the MongoDB; sleep 2; done;"]
      containers:
      - name: nrf
        image: free5gc/nrf:v4.2.2
        imagePullPolicy: IfNotPresent
        securityContext:
            allowPrivilegeEscalation: false
        ports:
        - name: nnrf
          containerPort: 8000
        command:
          - "/sbin/tini"
          - "--"
          - "./nrf"
        args:
          - "-c"
          - "./config/nrfcfg.yaml"
        env:
          - name: DB_URI
            value: mongodb://mongodb/free5gc
          - name: GIN_MODE
            value: release
        readinessProbe:
          httpGet:
            path: /nnrf-nfm/v1/
            scheme: HTTP
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold: 40
          successThreshold: 1
        volumeMounts:
        - mountPath: /free5gc/config/
          name: free5gc-helm-free5gc-nrf-volume
        - mountPath: /free5gc/config/TLS
          name: free5gc-helm-free5gc-nrf-empty-volume
        - mountPath: /free5gc/cert
          name: free5gc-helm-free5gc-nrf-cert-volume
        resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
        readinessProbe:
          initialDelaySeconds: 10
          periodSeconds: 1
          timeoutSeconds: 1
          failureThreshold:  40
          successThreshold: 1
          httpGet:
            scheme: "HTTP"
            port: 8000
        livenessProbe:
          initialDelaySeconds: 120
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          httpGet:
            scheme: "HTTP"
            port: 8000
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        5gc.free5gc.org/plane: control
      affinity:
        {}
      tolerations:
        []

      volumes:
      - name: free5gc-helm-free5gc-nrf-volume
        projected:
          sources:
          - configMap:
              name: free5gc-helm-free5gc-nrf-configmap
      - name: free5gc-helm-free5gc-nrf-empty-volume
        emptyDir: {}
      - name: free5gc-helm-free5gc-nrf-cert-volume
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: free5gc-helm-nrf-tls-secret
              items:
                - key: nrf.pem
                  path: nrf.pem
                - key: nrf.key
                  path: nrf.key
