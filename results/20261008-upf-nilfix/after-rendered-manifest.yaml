    project: free5gc
    nf: udr
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: free5gc-udr
      app.kubernetes.io/instance: free5gc-helm
      project: free5gc
      nf: udr
  template:
    metadata:
      annotations:
        
        checksum/config: f48027d16cf0a45d2ca9307e5fcfd199666dd2cc524d248f91de32ff58bbc1c4
      labels:
        app.kubernetes.io/name: free5gc-udr
        app.kubernetes.io/instance: free5gc-helm
        project: free5gc
        nf: udr
    spec:
      imagePullSecrets:
        []
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - name: wait-nrf
        image: curlimages/curl:8.7.1
        env:
        - name: DEPENDENCIES
          value: http://nrf-nnrf:8000
        command: ['sh', '-c', 'set -x; for dependency in $DEPENDENCIES; do while [ $(curl --insecure --connect-timeout 1 -s -o /dev/null -w "%{http_code}" $dependency) -ne 200 ]; do echo waiting for dependencies; sleep 1; done; done;']

      containers:
      - name: udr
        image: free5gc/udr:v4.2.2
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - name: nudr
          containerPort: 8080
        command:
          - "/sbin/tini"
          - "--"
          - "./udr"
        args:
          - "-c"
          - "./config/udrcfg.yaml"
        env:
          - name: DB_URI
            value: mongodb://mongodb/free5gc
          - name: GIN_MODE
            value: release
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              HEX_PORT=$(printf '%04X' "8080")
              grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp || grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp6
          initialDelaySeconds: 10
          periodSeconds: 1
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 40
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              HEX_PORT=$(printf '%04X' "8080")
              grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp || grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp6
          initialDelaySeconds: 50
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - mountPath: /free5gc/config/
          name: free5gc-helm-free5gc-udr-volume
        - mountPath: /free5gc/config/TLS
          name: free5gc-helm-free5gc-udr-empty-volume
        - mountPath: /free5gc/cert
          name: free5gc-helm-free5gc-udr-cert-volume
        resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        5gc.free5gc.org/plane: control
      affinity:
        {}
      tolerations:
        []

      volumes:
      - name: free5gc-helm-free5gc-udr-volume
        projected:
          sources:
          - configMap:
              name: free5gc-helm-free5gc-udr-configmap
      - name: free5gc-helm-free5gc-udr-empty-volume
        emptyDir: {}
      - name: free5gc-helm-free5gc-udr-cert-volume
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: free5gc-helm-udr-tls-secret
              items:
                - key: udr.pem
