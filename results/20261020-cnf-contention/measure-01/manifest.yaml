apiVersion: v1
kind: Namespace
metadata:
  name: cnf-contention
  labels:
    app.kubernetes.io/part-of: cnf-contention-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: cnf-contention
  name: cnf-c-endpoint
  labels: &id001
    app: cnf-c-endpoint
    app.kubernetes.io/part-of: cnf-contention-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnf-c-endpoint
  template:
    metadata:
      labels: *id001
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        5gc.free5gc.org/plane: control
      securityContext:
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: ue1
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command:
        - iperf3
        args:
        - -s
        - -p
        - '5201'
        - --forceflush
        - -V
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          periodSeconds: 2
        volumeMounts:
        - name: scratch
          mountPath: /tmp
      - name: ue2
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command:
        - iperf3
        args:
        - -s
        - -p
        - '5202'
        - --forceflush
        - -V
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          periodSeconds: 2
        volumeMounts:
        - name: scratch
          mountPath: /tmp
      - name: queue
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command:
        - sh
        - -ec
        - exec sleep infinity
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
          runAsNonRoot: false
          runAsUser: 0
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          periodSeconds: 2
      volumes:
      - name: scratch
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  namespace: cnf-contention
  name: cnf-c-endpoint
  labels:
    app: cnf-c-endpoint
    app.kubernetes.io/part-of: cnf-contention-v1
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: cnf-c-endpoint
  ports:
  - name: ue1-tcp
    port: 5201
    targetPort: 5201
    nodePort: 31401
    protocol: TCP
  - name: ue1-udp
    port: 5201
    targetPort: 5201
    nodePort: 31401
    protocol: UDP
  - name: ue2-tcp
    port: 5202
    targetPort: 5202
    nodePort: 31402
    protocol: TCP
  - name: ue2-udp
    port: 5202
    targetPort: 5202
    nodePort: 31402
    protocol: UDP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: cnf-contention
  name: cnf-c-endpoint
  labels:
    app: cnf-c-endpoint
    app.kubernetes.io/part-of: cnf-contention-v1
spec:
  podSelector:
    matchLabels:
      app: cnf-c-endpoint
  policyTypes:
  - Ingress
  ingress:
  - ports:
    - protocol: TCP
      port: 5201
    - protocol: UDP
      port: 5201
    - protocol: TCP
      port: 5202
    - protocol: UDP
      port: 5202
  - from:
    - ipBlock:
        cidr: 192.168.244.129/32
    - ipBlock:
        cidr: 10.42.1.0/24
    - ipBlock:
        cidr: 10.60.0.0/16
