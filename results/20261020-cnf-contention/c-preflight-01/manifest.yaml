apiVersion: v1
kind: ConfigMap
metadata:
  name: cnf-a-ue2
  namespace: free5gc
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
data:
  ue-config.yaml: "supi: imsi-208930000000002\nmcc: '208'\nmnc: '93'\nkey: d6823874fead42caa9e84a9fdb189a18\n\
    op: ff190ef083ac1b95dea60dd715ac79e9\nopType: OPC\namf: '8000'\nimei: '356938035643804'\n\
    imeiSv: '4370816125816152'\nuacAic:\n  mps: false\n  mcs: false\nuacAcc:\n  normalClass:\
    \ 0\n  class11: false\n  class12: false\n  class13: false\n  class14: false\n\
    \  class15: false\nsessions:\n- type: IPv4\n  apn: internet\n  slice: &id001\n\
    \    sst: 1\n    sd: 66051\nconfigured-nssai:\n- *id001\ndefault-nssai:\n- sst:\
    \ 1\n  sd: 1\nintegrity:\n  IA1: true\n  IA2: true\n  IA3: true\nciphering:\n\
    \  EA1: true\n  EA2: true\n  EA3: true\nintegrityMaxRate:\n  uplink: full\n  downlink:\
    \ full\ngnbSearchList:\n- gnb-service\n"
  wrapper.sh: '#!/bin/sh

    set -eu

    mkdir -p /dev/net

    [ -c /dev/net/tun ] || mknod /dev/net/tun c 10 200

    exec ./nr-ue -c /ueransim/config/ue-config.yaml

    '
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-a-ue2
  namespace: free5gc
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cnf-a-ue2
  template:
    metadata:
      labels:
        app: cnf-a-ue2
        app.kubernetes.io/part-of: cnf-multi-ue-v1
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        5gc.free5gc.org/role: ran-test
      containers:
      - name: ue
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command:
        - /bin/sh
        - /ueransim/config/wrapper.sh
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          capabilities:
            add:
            - NET_ADMIN
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - test -d /sys/class/net/uesimtun0 && kill -0 1
          initialDelaySeconds: 2
          periodSeconds: 2
        volumeMounts:
        - name: ue
          mountPath: /ueransim/config
          readOnly: true
      volumes:
      - name: ue
        configMap:
          name: cnf-a-ue2
