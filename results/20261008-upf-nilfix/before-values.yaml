    nodeSelector:
      5gc.free5gc.org/plane: control
global:
  amf:
    multus:
      enabled: false
  smf:
    multus:
      enabled: false
  upf:
    multus:
      enabled: false
  userPlaneArchitecture: single
mongodb:
  args: []
  command: []
  extraVolumeMounts: []
  extraVolumes: []
  initContainers: []
  nodeSelector:
    5gc.free5gc.org/plane: control
  persistence:
    size: 6Gi
    storageClass: local-path
userPlaneSelector:
  5gc.free5gc.org/gtp5g: "true"
  5gc.free5gc.org/plane: user
