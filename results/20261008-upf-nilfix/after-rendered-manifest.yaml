# Software description: An open-source project providing Helm charts to deploy 5G components (Core + RAN) on top of Kubernetes
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: free5gc-helm-free5gc-amf-amf
  labels:
    helm.sh/chart: free5gc-amf-0.2.7
    app.kubernetes.io/name: free5gc-amf
    app.kubernetes.io/instance: free5gc-helm
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
    project: free5gc
    nf: amf
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: free5gc-amf
      app.kubernetes.io/instance: free5gc-helm
      project: free5gc
      nf: amf
  template:
    metadata:
      annotations:
        
        checksum/config: c6b4693917b467c7384f0429950f31372e9d31ddf4e842fb5abe18ce3b10df83
      labels:
        app.kubernetes.io/name: free5gc-amf
        app.kubernetes.io/instance: free5gc-helm
        project: free5gc
        nf: amf
    spec:
      imagePullSecrets:
        []
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - name: wait-nrf
        image: curlimages/curl:8.7.1
        env:
        - name: DEPENDENCIES
          value: http://nrf-nnrf:8000
        command: ['sh', '-c', 'set -x; for dependency in $DEPENDENCIES; do while [ $(curl --insecure --connect-timeout 1 -s -o /dev/null -w "%{http_code}" $dependency) -ne 200 ]; do echo waiting for dependencies; sleep 1; done; done;']

      containers:
      - name: amf
        image: free5gc/amf:v4.2.2
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - name: namf
          containerPort: 8080
        - name: n2
          containerPort: 38412
          protocol: SCTP
        command:
          - "/sbin/tini"
          - "--"
          - "./amf"
        args:
          - "-c"
          - "./config/amfcfg.yaml"
        env:
          - name: GIN_MODE
            value: release
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              HEX_PORT=$(printf '%04X' "8080")
              grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp || grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp6
          initialDelaySeconds: 10
          periodSeconds: 1
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 40
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - |
              HEX_PORT=$(printf '%04X' "8080")
              grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp || grep -q ":${HEX_PORT} .* 0A " /proc/net/tcp6
          initialDelaySeconds: 50
          periodSeconds: 10
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        volumeMounts:
        - mountPath: /free5gc/config/
          name: free5gc-helm-free5gc-amf-volume
        - mountPath: /free5gc/config/TLS
          name: free5gc-helm-free5gc-amf-empty-volume
        - mountPath: /free5gc/cert
          name: free5gc-helm-free5gc-amf-cert-volume
        resources:
            limits:
              cpu: 300m
              memory: 256Mi
            requests:
              cpu: 150m
              memory: 128Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      nodeSelector:
        5gc.free5gc.org/plane: control
      affinity:
        {}
      tolerations:
        []

      volumes:
      - name: free5gc-helm-free5gc-amf-volume
        projected:
          sources:
          - configMap:
              name: free5gc-helm-free5gc-amf-configmap
      - name: free5gc-helm-free5gc-amf-empty-volume
        emptyDir: {}
      - name: free5gc-helm-free5gc-amf-cert-volume
        projected:
          defaultMode: 0400
          sources:
          - secret:
              name: free5gc-helm-amf-tls-secret
              items:
                - key: amf.pem
                  path: amf.pem
                - key: amf.key
                  path: amf.key
          - configMap:
              name: free5gc-public-certs
              items:
                - key: nrf.pem
                  path: nrf.pem
