apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-m1-backend
  namespace: cnf-lab
  labels:
    app.kubernetes.io/part-of: cnf-m1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnf-m1-backend
  template:
    metadata:
      labels:
        app: cnf-m1-backend
        app.kubernetes.io/part-of: cnf-m1
      annotations:
        cnf.lab/shaping-version: cnf-m3-v1
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        5gc.free5gc.org/plane: control
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: iperf3
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command:
        - iperf3
        args:
        - -s
        - -p
        - '5201'
        - --forceflush
        - -V
        volumeMounts:
        - name: scratch
          mountPath: /tmp
        ports:
        - name: iperf
          containerPort: 5201
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          initialDelaySeconds: 2
          periodSeconds: 5
      - name: tc
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command:
        - sh
        - -ec
        - 'tc qdisc add dev eth0 root handle 1: tbf rate 5mbit burst 32kb latency
          100ms; exec sleep infinity'
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - 'tc qdisc show dev eth0 | grep -q "qdisc tbf 1: root"'
          periodSeconds: 5
      volumes:
      - name: scratch
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
  strategy:
    type: Recreate
---
