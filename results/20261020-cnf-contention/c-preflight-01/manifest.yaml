apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-a-envoy
  namespace: cnf-multi-ue
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnf-a-envoy
  template:
    metadata:
      labels:
        app: cnf-a-envoy
        app.kubernetes.io/part-of: cnf-multi-ue-v1
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        5gc.free5gc.org/plane: control
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: envoy
        image: docker.io/envoyproxy/envoy@sha256:63dd445d23d7d419d1bba8b2b9b1b8fdb80f38ae1516fb5d2dcd8856713b7eac
        imagePullPolicy: IfNotPresent
        command:
        - envoy
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --concurrency
        - '1'
        - --log-level
        - info
        - --disable-hot-restart
        ports:
        - name: ue1-core
          containerPort: 15301
          protocol: TCP
        - name: ue2-core
          containerPort: 15302
          protocol: TCP
        - name: ue1-edge
          containerPort: 15303
          protocol: TCP
        - name: ue2-edge
          containerPort: 15304
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
          readOnly: true
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: cnf-a-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: cnf-a-envoy
  namespace: cnf-multi-ue
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: cnf-a-envoy
  ports:
  - name: ue1-core
    port: 15301
    targetPort: 15301
    nodePort: 31301
    protocol: TCP
  - name: ue2-core
    port: 15302
    targetPort: 15302
    nodePort: 31302
    protocol: TCP
  - name: ue1-edge
    port: 15303
    targetPort: 15303
    nodePort: 31303
    protocol: TCP
  - name: ue2-edge
    port: 15304
    targetPort: 15304
    nodePort: 31304
    protocol: TCP
---
