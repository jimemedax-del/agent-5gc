apiVersion: v1
kind: Namespace
metadata:
  name: cnf-multi-ue
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cnf-a-core-ue1
  namespace: cnf-multi-ue
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cnf-a-core-ue1
  template:
    metadata:
      labels:
        app: cnf-a-core-ue1
        role: backend
        app.kubernetes.io/part-of: cnf-multi-ue-v1
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        5gc.free5gc.org/plane: control
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: iperf3
        image: docker.io/local/ueransim-iperf3@sha256:2c464fbf9eccafe187e2a2565e6ee3cdb4c3e256f76d223bf520103dc30e803b
        imagePullPolicy: Never
        command:
        - iperf3
        args:
        - -s
        - -p
        - '5201'
        - --forceflush
        - -V
        volumeMounts:
        - name: scratch
          mountPath: /tmp
        ports:
        - name: iperf
          containerPort: 5201
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - kill -0 1
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: scratch
        emptyDir:
          medium: Memory
          sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cnf-a-core-ue1
  namespace: cnf-multi-ue
  labels:
    app.kubernetes.io/part-of: cnf-multi-ue-v1
spec:
  selector:
    app: cnf-a-core-ue1
  ports:
  - name: iperf
    port: 5201
    targetPort: iperf
    protocol: TCP
